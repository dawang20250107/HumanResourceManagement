services:
  postgres:
    image: postgres:16-alpine
    container_name: flexforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexforce
      POSTGRES_PASSWORD: flexforce
      POSTGRES_DB: flexforce
    ports:
      - "5432:5432"
    volumes:
      - flexforce-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexforce -d flexforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flexforce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - flexforce-redisdata:/data

volumes:
  flexforce-pgdata:
  flexforce-redisdata:
